name: Fix 100 percent zoom return

on:
  push:
    branches:
      - gui-foundation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui-foundation
          fetch-depth: 0
      - name: Apply zoom return patch
        run: python3 .github/apply_zoom_return.py
