name: Finalize fixed size GUI

on:
  push:
    branches:
      - gui-foundation

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui-foundation
          fetch-depth: 0
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Remove zoom and add compact logo
        run: python3 .github/apply_zoom_return.py
