name: Fix Studio One zoom correctly

on:
  push:
    branches:
      - gui-foundation
    paths:
      - .github/workflows/fix-zoom-logo.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui-foundation

      - name: Patch zoom only
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/plugin/AnalysatorController.cpp')
          s = p.read_text(encoding='utf-8')

          old = '''    if (e)\n    {\n        const auto baseSize = uiDetailsVisible_ ? kDetailsSize : kCompactSize;\n        const auto zoom = e->getZoomFactor();\n        e->requestResize({baseSize.x * zoom, baseSize.y * zoom});\n    }'''
          new = '''    if (e)\n    {\n        const auto baseSize = uiDetailsVisible_ ? kDetailsSize : kCompactSize;\n        e->setEditorSizeConstrains(baseSize, baseSize);\n    }'''
          if old not in s:
              raise SystemExit('didOpen anchor not found')
          s = s.replace(old, new, 1)

          old = '''                e->exchangeView("detailsView");\n                const auto zoom = e->getZoomFactor();\n                e->requestResize({kDetailsSize.x * zoom, kDetailsSize.y * zoom});'''
          new = '''                e->exchangeView("detailsView");\n                e->setEditorSizeConstrains(kDetailsSize, kDetailsSize);'''
          if old not in s:
              raise SystemExit('details anchor not found')
          s = s.replace(old, new, 1)

          old = '''                e->exchangeView("compactView");\n                const auto zoom = e->getZoomFactor();\n                e->requestResize({kCompactSize.x * zoom, kCompactSize.y * zoom});'''
          new = '''                e->exchangeView("compactView");\n                e->setEditorSizeConstrains(kCompactSize, kCompactSize);'''
          if old not in s:
              raise SystemExit('compact anchor not found')
          s = s.replace(old, new, 1)

          old = '''                const bool enlarge = editor_->getZoomFactor() < 1.2;\n                const auto zoom = enlarge ? kZoom100 : kZoom68;\n                editor_->setZoomFactor(zoom);\n                const auto baseSize = uiDetailsVisible_ ? kDetailsSize : kCompactSize;\n                editor_->requestResize({baseSize.x * zoom, baseSize.y * zoom});\n                if (auto* b = dynamic_cast<VSTGUI::CTextButton*>(c))\n                    setButtonTitle(b, enlarge ? "100%" : "68%");'''
          new = '''                const bool enlarge = editor_->getZoomFactor() < 1.2;\n                const auto zoom = enlarge ? kZoom100 : kZoom68;\n                const auto baseSize = uiDetailsVisible_ ? kDetailsSize : kCompactSize;\n                editor_->setZoomFactor(zoom);\n                editor_->setEditorSizeConstrains(baseSize, baseSize);\n                if (auto* b = dynamic_cast<VSTGUI::CTextButton*>(c))\n                    setButtonTitle(b, enlarge ? "100%" : "68%");'''
          if old not in s:
              raise SystemExit('zoom anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit zoom fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugin/AnalysatorController.cpp
          git rm .github/workflows/fix-zoom-logo.yml
          git commit -m "Fix Studio One zoom using VSTGUI constraints"
          git push origin HEAD:gui-foundation
