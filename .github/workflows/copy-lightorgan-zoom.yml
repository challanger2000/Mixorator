name: Copy LightOrgan zoom implementation

on:
  push:
    branches:
      - gui-foundation
    paths:
      - .github/workflows/copy-lightorgan-zoom.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui-foundation
          fetch-depth: 0

      - name: Apply LightOrgan zoom pattern
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/plugin/AnalysatorController.cpp')
          s = p.read_text(encoding='utf-8')

          s = s.replace('constexpr double kZoom68 = 1.0;\nconstexpr double kZoom100 = 100.0 / 68.0;',
                        'constexpr double kZoom68 = 0.68;\nconstexpr double kZoom100 = 1.0;', 1)

          old = '''    if (e)\n    {\n        const auto baseSize = uiDetailsVisible_ ? kDetailsSize : kCompactSize;\n        e->setEditorSizeConstrains(baseSize, baseSize);\n        const auto scale = e->getAbsScaleFactor();\n        e->requestResize({baseSize.x * scale, baseSize.y * scale});\n    }'''
          if old not in s: raise SystemExit('didOpen anchor missing')
          s = s.replace(old, '', 1)

          old = '''                e->exchangeView("detailsView");\n                e->setEditorSizeConstrains(kDetailsSize, kDetailsSize);\n                const auto scale = e->getAbsScaleFactor();\n                e->requestResize({kDetailsSize.x * scale, kDetailsSize.y * scale});'''
          if old not in s: raise SystemExit('details anchor missing')
          s = s.replace(old, '                e->exchangeView("detailsView");', 1)

          old = '''                e->exchangeView("compactView");\n                e->setEditorSizeConstrains(kCompactSize, kCompactSize);\n                const auto scale = e->getAbsScaleFactor();\n                e->requestResize({kCompactSize.x * scale, kCompactSize.y * scale});'''
          if old not in s: raise SystemExit('back anchor missing')
          s = s.replace(old, '                e->exchangeView("compactView");', 1)

          old = '''                const bool enlarge = editor_->getZoomFactor() < 1.2;\n                const auto zoom = enlarge ? kZoom100 : kZoom68;\n                const auto baseSize = uiDetailsVisible_ ? kDetailsSize : kCompactSize;\n                editor_->setZoomFactor(zoom);\n                editor_->setEditorSizeConstrains(baseSize, baseSize);\n                const auto scale = editor_->getAbsScaleFactor();\n                editor_->requestResize({baseSize.x * scale, baseSize.y * scale});\n                if (auto* b = dynamic_cast<VSTGUI::CTextButton*>(c))\n                    setButtonTitle(b, enlarge ? "100%" : "68%");'''
          new = '''                const bool enlarge = editor_->getZoomFactor() < 0.84;\n                editor_->setZoomFactor(enlarge ? kZoom100 : kZoom68);\n                if (auto* b = dynamic_cast<VSTGUI::CTextButton*>(c))\n                    setButtonTitle(b, enlarge ? "100%" : "68%");'''
          if old not in s: raise SystemExit('zoom anchor missing')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugin/AnalysatorController.cpp
          git rm .github/workflows/copy-lightorgan-zoom.yml
          git commit -m "Use proven LightOrgan 68/100 zoom behavior"
          git push origin HEAD:gui-foundation
