name: Build Windows VST3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build tests
        run: cmake --build build --config Release --target MixoratorTests MixoratorLocalStereoTests MixoratorAnalyzerIntegrityTests MixoratorLoudnessMetrologyTests MixoratorTruePeakMetrologyTests MixoratorProcessorTransparencyTests MixoratorProcessorRobustnessTests MixoratorMasterScenarioTests MixoratorRealWorldReferenceTests MixoratorDetailedTonalCalibrationTests MixoratorControllerStateCodecTests --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build plugin
        run: cmake --build build --config Release --target Analysator --parallel

      - name: Build offline analyzer
        run: cmake --build build --config Release --target MixoratorOfflineAnalyzer --parallel

      - name: Stage artifacts
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter Analysator.vst3 | Select-Object -First 1
          if (-not $plugin) { throw "Analysator.vst3 bundle not found" }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Path $plugin.FullName -Destination artifact -Recurse -Force
          if (-not (Test-Path "artifact\Analysator.vst3\Contents")) { throw "Staged VST3 bundle is incomplete" }

          $offline = Get-ChildItem -Path build -Recurse -File -Filter MixoratorOfflineAnalyzer.exe | Select-Object -First 1
          if (-not $offline) { throw "MixoratorOfflineAnalyzer.exe not found" }
          New-Item -ItemType Directory -Force -Path offline-artifact | Out-Null
          Copy-Item -Path $offline.FullName -Destination offline-artifact -Force

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Analysator-Windows-VST3
          path: artifact

      - name: Upload offline analyzer
        uses: actions/upload-artifact@v4
        with:
          name: Mixorator-Offline-Analyzer-Windows
          path: offline-artifact
