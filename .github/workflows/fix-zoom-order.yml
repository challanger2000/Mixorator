name: Fix zoom order
on:
  push:
    branches:
      - gui-foundation
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui-foundation
      - name: Use native VSTGUI zoom path for compact zoom
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/plugin/AnalysatorController.cpp')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(\s*const bool enlarge = editor_->getZoomFactor\(\) < 1\.2;\n\s*const double zoom = enlarge \? kZoom100 : kZoom68;)\n\s*const auto& baseSize = uiDetailsVisible_ \? kDetailsSize : kCompactSize;\n\s*if \(auto\* e = dynamic_cast<AnalysatorEditor\*>\(editor_\)\)\n\s*e->setUserZoom\(zoom, baseSize\);\n\s*else\n\s*editor_->setZoomFactor\(zoom\);')
          s2, n = pattern.subn(r'\1\n                editor_->setZoomFactor(zoom);', s, count=1)
          if n != 1:
              raise SystemExit(f'Zoom handler replacements: {n}')
          p.write_text(s2, encoding='utf-8')
      - name: Remove helper and commit
        run: |
          rm .github/workflows/fix-zoom-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use native VSTGUI zoom resize path"
          git push origin gui-foundation
