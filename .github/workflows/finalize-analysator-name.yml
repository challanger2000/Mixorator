name: Apply direct Analysator zoom patch

on:
  push:
    branches: [gui-foundation]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui-foundation
          fetch-depth: 0
      - name: Apply patch
        run: python .github/apply_direct_zoom.py
