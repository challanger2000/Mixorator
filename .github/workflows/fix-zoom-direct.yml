name: Fix Analysator direct 100/150 zoom

on:
  workflow_dispatch:
  push:
    branches: [gui-foundation]
    paths:
      - '.github/workflows/fix-zoom-direct.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui-foundation
          fetch-depth: 0

      - name: Restore original geometry and install direct editor zoom
        shell: bash
        run: |
          git checkout fcb25ee21197221c61a086a4c4d6efef7e080cd4 -- src/resource/analysator.uidesc src/resource/analysator_main_bg.png src/resource/analysator_details_bg.png

          python <<'PY'
          from pathlib import Path

          cpp_path = Path('src/plugin/AnalysatorController.cpp')
          cpp = cpp_path.read_text(encoding='utf-8')

          if '#include "vstgui/lib/cdrawcontext.h"' not in cpp:
              cpp = cpp.replace('#include "vstgui/lib/ccolor.h"\n', '#include "vstgui/lib/ccolor.h"\n#include "vstgui/lib/cdrawcontext.h"\n#include "vstgui/lib/cfont.h"\n')

          old = '''constexpr double kZoom68 = 0.68;
constexpr double kZoom100 = 1.0;
constexpr std::int32_t kUiZoomTag = 10013;

class AnalysatorEditor final : public VSTGUI::VST3Editor
{
public:
    using VSTGUI::VST3Editor::VST3Editor;

    bool setUserZoom(double factor)
    {
        if (factor != kZoom68 && factor != kZoom100)
            return false;
        setZoomFactor(factor);
        return true;
    }

    bool isZoom100() const noexcept { return getZoomFactor() > 0.84; }
};'''

          new = '''constexpr double kZoom68 = 1.0;   // native GUI = 100%
constexpr double kZoom100 = 1.5;  // enlarged GUI = 150%
constexpr std::int32_t kUiZoomTag = 10013;

class AnalysatorEditor final : public VSTGUI::VST3Editor
{
public:
    using VSTGUI::VST3Editor::VST3Editor;

    bool setUserZoom(double factor)
    {
        if (factor != kZoom68 && factor != kZoom100)
            return false;
        setZoomFactor(factor);
        return true;
    }

    bool isZoom100() const noexcept { return getZoomFactor() > 1.25; }

    VSTGUI::CView* createView(const VSTGUI::UIAttributes& attributes,
                              const VSTGUI::IUIDescription* description) override;
};

class ZoomView final : public VSTGUI::CView
{
public:
    ZoomView(const VSTGUI::CRect& r, AnalysatorEditor* editor)
    : VSTGUI::CView(r), editor_(editor)
    {
        setMouseEnabled(true);
    }

    void draw(VSTGUI::CDrawContext* ctx) override
    {
        if (!ctx || !editor_)
        {
            setDirty(false);
            return;
        }
        auto r = getViewSize();
        ctx->setDrawMode(VSTGUI::kAntiAliasing);
        ctx->setFillColor(VSTGUI::CColor(0, 0, 0, 0));
        ctx->setFrameColor(VSTGUI::CColor(0, 0, 0, 0));
        ctx->drawRect(r, VSTGUI::kDrawFilledAndStroked);
        ctx->setFont(VSTGUI::kNormalFontSmall);
        ctx->setFontColor(VSTGUI::CColor(169, 177, 183, 255));
        ctx->drawString(editor_->getZoomFactor() > 1.25 ? "150%" : "100%",
                        r, VSTGUI::kCenterText);
        setDirty(false);
    }

    VSTGUI::CMouseEventResult onMouseDown(VSTGUI::CPoint&,
                                           const VSTGUI::CButtonState&) override
    {
        if (!editor_)
            return VSTGUI::kMouseEventNotHandled;
        editor_->setUserZoom(editor_->getZoomFactor() > 1.25 ? kZoom68 : kZoom100);
        invalid();
        return VSTGUI::kMouseEventHandled;
    }

private:
    AnalysatorEditor* editor_ {};
};

VSTGUI::CView* AnalysatorEditor::createView(const VSTGUI::UIAttributes& attributes,
                                             const VSTGUI::IUIDescription* description)
{
    if (const auto name = attributes.getAttributeValue(VSTGUI::IUIDescription::kCustomViewName))
    {
        if (*name == "UiZoomCompact")
            return new ZoomView({478., 12., 540., 32.}, this);
        if (*name == "UiZoomDetails")
            return new ZoomView({914., 6., 980., 24.}, this);
    }
    return VSTGUI::VST3Editor::createView(attributes, description);
}'''

          if old not in cpp:
              raise SystemExit('Expected current zoom editor block not found')
          cpp = cpp.replace(old, new)
          cpp_path.write_text(cpp, encoding='utf-8')

          ui_path = Path('src/resource/analysator.uidesc')
          ui = ui_path.read_text(encoding='utf-8')
          compact_old = '<view class="CTextButton" control-tag="UI.Zoom" origin="478, 12" size="62, 20" title="68%" text-color="MutedText" text-color-highlighted="Text" font="SmallFont" text-alignment="center" frame-width="0" gradient="HardwareClear" gradient-highlighted="HardwareAction" kick-style="true"/>'
          compact_new = '<view class="CView" origin="478, 12" size="62, 20" custom-view-name="UiZoomCompact" transparent="true"/>'
          details_old = '<view class="CTextButton" control-tag="UI.Zoom" origin="914, 6" size="66, 18" title="68%" text-color="MutedText" text-color-highlighted="Text" font="SmallFont" text-alignment="center" frame-width="0" gradient="HardwareClear" gradient-highlighted="HardwareAction" kick-style="true"/>'
          details_new = '<view class="CView" origin="914, 6" size="66, 18" custom-view-name="UiZoomDetails" transparent="true"/>'
          if compact_old not in ui or details_old not in ui:
              raise SystemExit('Expected original zoom buttons not found in restored UIDesc')
          ui = ui.replace(compact_old, compact_new).replace(details_old, details_new)
          ui_path.write_text(ui, encoding='utf-8')
          PY

      - name: Verify direct zoom architecture
        shell: bash
        run: |
          grep -F 'size="650, 440"' src/resource/analysator.uidesc
          grep -F 'size="1000, 700"' src/resource/analysator.uidesc
          grep -F 'custom-view-name="UiZoomCompact"' src/resource/analysator.uidesc
          grep -F 'custom-view-name="UiZoomDetails"' src/resource/analysator.uidesc
          grep -F 'constexpr double kZoom68 = 1.0;' src/plugin/AnalysatorController.cpp
          grep -F 'constexpr double kZoom100 = 1.5;' src/plugin/AnalysatorController.cpp
          grep -F 'editor_->setUserZoom' src/plugin/AnalysatorController.cpp
          ! grep -q 'Brand125A' src/resource/analysator.uidesc

      - name: Commit direct zoom fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-zoom-direct.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/plugin/AnalysatorController.cpp src/resource/analysator.uidesc src/resource/analysator_main_bg.png src/resource/analysator_details_bg.png .github/workflows/fix-zoom-direct.yml
          git commit -m 'Use proven direct editor zoom at 100 and 150 percent'
          git push origin HEAD:gui-foundation
