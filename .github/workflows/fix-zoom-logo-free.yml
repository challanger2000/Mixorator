name: Fix logo-free zoom
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui-foundation
      - name: Remove logo and restore Analysator 68/100 sizing
        shell: python
        run: |
          from pathlib import Path
          import re
          u = Path('src/resource/analysator.uidesc')
          s = u.read_text(encoding='utf-8')
          s = s.replace('<bitmap name="Brand125A" path="125a_gui.png"/>','')
          s = re.sub(r'<view class="CViewContainer" origin="224, 10" size="64, 28" bitmap="Brand125A" transparent="true"/>','',s)
          s = re.sub(r'<view class="CViewContainer" origin="558, 30" size="42, 28" bitmap="Brand125A" transparent="true"/>','',s)
          u.write_text(s,encoding='utf-8')
          p = Path('src/plugin/AnalysatorController.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('constexpr double kZoom68 = 0.68;','constexpr double kZoom68 = 1.0;')
          s = s.replace('constexpr double kZoom100 = 1.0;','constexpr double kZoom100 = 100.0 / 68.0;')
          s = s.replace('editor && editor->getZoomFactor() > 1.2 ? "100%" : "68%"','editor && editor->getZoomFactor() > 1.2 ? "100%" : "68%"')
          s = s.replace('const bool enlarge = editor_->getZoomFactor() < 0.84;','const bool enlarge = editor_->getZoomFactor() < 1.2;')
          p.write_text(s,encoding='utf-8')
      - name: Remove helper and commit
        run: |
          rm .github/workflows/fix-zoom-logo-free.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove logo and restore Analysator zoom scale"
          git push origin gui-foundation