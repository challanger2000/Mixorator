name: Fix zoom direction and host size
on:
  push:
    branches:
      - gui-foundation
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui-foundation
          fetch-depth: 0
      - name: Patch deterministic zoom
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/plugin/AnalysatorController.cpp')
          s = p.read_text(encoding='utf-8')

          s = s.replace('''    bool setUserZoom(double factor, const VSTGUI::CPoint& baseSize)\n    {\n        const double absoluteScale = factor * getContentScaleFactor();\n        if (!requestResize({baseSize.x * absoluteScale, baseSize.y * absoluteScale}))\n            return false;\n        setZoomFactor(factor);\n        return true;\n    }''', '''    bool setUserZoom(double factor, const VSTGUI::CPoint& baseSize)\n    {\n        if (!requestResize({baseSize.x * factor, baseSize.y * factor}))\n            return false;\n        setZoomFactor(factor);\n        zoom100_ = factor > 1.2;\n        return true;\n    }\n\n    bool isZoom100() const noexcept { return zoom100_; }\n\nprivate:\n    bool zoom100_ = false;''')

          s = s.replace('''                if (auto* b = dynamic_cast<VSTGUI::CTextButton*>(c))\n                    setButtonTitle(b, editor && editor->getZoomFactor() > 1.2 ? "100%" : "68%");''', '''                if (auto* b = dynamic_cast<VSTGUI::CTextButton*>(c))\n                {\n                    const auto* ae = dynamic_cast<AnalysatorEditor*>(editor);\n                    setButtonTitle(b, ae && ae->isZoom100() ? "100%" : "68%");\n                }''')

          old = '''                const bool enlarge = editor_->getZoomFactor() < 1.2;\n                const double zoom = enlarge ? kZoom100 : kZoom68;\n                const auto& baseSize = uiDetailsVisible_ ? kDetailsSize : kCompactSize;\n                bool changed = false;\n                if (auto* e = dynamic_cast<AnalysatorEditor*>(editor_))\n                    changed = e->setUserZoom(zoom, baseSize);\n                if (changed)\n                    if (auto* b = dynamic_cast<VSTGUI::CTextButton*>(c))\n                        setButtonTitle(b, enlarge ? "100%" : "68%");'''
          new = '''                const auto& baseSize = uiDetailsVisible_ ? kDetailsSize : kCompactSize;\n                if (auto* e = dynamic_cast<AnalysatorEditor*>(editor_))\n                {\n                    const bool enlarge = !e->isZoom100();\n                    const double zoom = enlarge ? kZoom100 : kZoom68;\n                    if (e->setUserZoom(zoom, baseSize))\n                        if (auto* b = dynamic_cast<VSTGUI::CTextButton*>(c))\n                            setButtonTitle(b, enlarge ? "100%" : "68%");\n                }'''
          if old not in s:
              raise SystemExit('zoom handler pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          s = Path('src/plugin/AnalysatorController.cpp').read_text(encoding='utf-8')
          assert 'factor * getContentScaleFactor()' not in s
          assert 'baseSize.x * factor' in s
          assert 'bool zoom100_ = false;' in s
          assert 'const bool enlarge = !e->isZoom100();' in s
      - name: Commit
        run: |
          rm .github/workflows/fix-zoom-direction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix 68 to 100 zoom direction and sizing"
          git push origin HEAD:gui-foundation
