name: Fix zoom like SMX-3
on:
  push:
    branches:
      - gui-foundation
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui-foundation
      - name: Remove fixed template constraints and use native VSTGUI zoom
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/resource/analysator.uidesc')
          s = p.read_text(encoding='utf-8')
          s = s.replace(' minSize="650, 440" maxSize="650, 440"', '')
          s = s.replace(' minSize="1000, 700" maxSize="1000, 700"', '')
          p.write_text(s, encoding='utf-8')

          p = Path('src/plugin/AnalysatorController.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''    void setUserZoom(double factor, const VSTGUI::CPoint& baseSize)
    {
        const double absoluteScale = factor * getContentScaleFactor();
        const VSTGUI::CPoint target {baseSize.x * absoluteScale, baseSize.y * absoluteScale};
        if (requestResize(target))
            setZoomFactor(factor);
    }'''
          if old in s:
              s = s.replace(old, '''    void setUserZoom(double factor, const VSTGUI::CPoint&)
    {
        setZoomFactor(factor);
    }''', 1)
          old2 = '''                const bool enlarge = editor_->getZoomFactor() < 1.2;
                const double zoom = enlarge ? kZoom100 : kZoom68;
                const auto& baseSize = uiDetailsVisible_ ? kDetailsSize : kCompactSize;
                if (auto* e = dynamic_cast<AnalysatorEditor*>(editor_))
                    e->setUserZoom(zoom, baseSize);
                else
                    editor_->setZoomFactor(zoom);'''
          if old2 in s:
              s = s.replace(old2, '''                const bool enlarge = editor_->getZoomFactor() < 1.2;
                const double zoom = enlarge ? kZoom100 : kZoom68;
                editor_->setZoomFactor(zoom);''', 1)
          marker = '        e->setZoomFactor(kZoom68);\n'
          if marker in s and 'setAllowedZoomFactors({kZoom68, kZoom100})' not in s:
              s = s.replace(marker, marker + '        e->setAllowedZoomFactors({kZoom68, kZoom100});\n', 1)
          p.write_text(s, encoding='utf-8')
      - name: Remove helper and commit
        run: |
          rm .github/workflows/fix-zoom-like-smx3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match SMX-3 native VSTGUI zoom behavior"
          git push origin gui-foundation
